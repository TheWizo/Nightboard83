name: Auto Pull on Main
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: docker
    steps:
      - name: Add SSH_PRIVATE_KEY to agent
        run: |
         eval $(ssh-agent -s)
         echo "${{ secrets.SSH_PRIVATE_KEY }}" | ssh-add -
      - name: Execute git pull on server
        run: |
          ssh -o StrictHostKeyChecking=no ralf@optimusprime.blackneon.net "cd /var/www/Nightboard83.de/app && git pull"
