name: Auto Pull on Main
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: docker
    steps:
      - name: Save SSH_PRIVATE_KEY
        run: |
         echo "${{ secrets.SSH_PRIVATE_KEY }}" > ssh_key
         chmod 600 ssh_key
      - name: Execute git pull on server
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key ralf@optimusprime.blackneon.net "cd /var/www/Nightboard83.de/app && git pull"
      - name: Remove SSH_PRIVATE_KEY
        run: |
          rm ssh_key
