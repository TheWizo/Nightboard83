<!DOCTYPE html>
<meta charset="utf-8">
<title>pending</title>
<pre id="out">running</pre>
<script src="../js/core.js"></script>
<script>
function fail(msg) {
  document.title = "FAIL";
  document.getElementById("out").textContent = String(msg);
}
try {
  const s = window.NBCore.sanitize;
  const emoji = s('<p>hi <img src="https://ex.example/e.png" alt=":e:" class="emoji" onerror="alert(1)"> x</p>');
  if (!emoji.includes('src="https://ex.example/e.png"')) throw new Error("emoji src " + emoji);
  if (/onerror/i.test(emoji)) throw new Error("handler survived");
  const js = s('<img src="javascript:alert(1)" alt="x">');
  if (/javascript:/i.test(js) || /<img/i.test(js)) throw new Error("js src " + js);
  const data = s('<img src="data:image/png;base64,xx">');
  if (/<img/i.test(data)) throw new Error("data uri " + data);
  const wrap = s('<' + 'script>alert(1)</' + 'script><p>ok</p>');
  if (/<script/i.test(wrap)) throw new Error("script " + wrap);
  if (!wrap.includes("<p>ok</p>")) throw new Error("p dropped " + wrap);
  const wrappedImg = s('<div><img src="https://ex.example/e.png" onerror="alert(1)"></div>');
  if (/onerror/i.test(wrappedImg)) throw new Error("wrapped handler " + wrappedImg);
  if (!wrappedImg.includes('src="https://ex.example/e.png"')) throw new Error("wrapped src " + wrappedImg);
  const noscript = s('<noscript><img src="x" onerror="alert(1)"></noscript>');
  if (/onerror|<img/i.test(noscript)) throw new Error("noscript " + noscript);
  const wrappedLink = s('<foo><a href="javascript:alert(1)">x</a></foo>');
  if (/javascript:/i.test(wrappedLink)) throw new Error("wrapped javascript href " + wrappedLink);
  const nested = s('<div><span><strong>ok</strong></span></div>');
  if (!nested.includes("<strong>ok</strong>")) throw new Error("nested markup " + nested);
  document.title = "PASS";
  document.getElementById("out").textContent = "PASS " + emoji;
} catch (e) {
  fail(e && e.stack || e);
}
</script>
