<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Inscribed dark well + NB. Corners of the square stay transparent so
       icon packs that overlay the bitmap do not cover their chrome disc
       with a rectangle. Android crops this circle for adaptive icons. -->
  <defs>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="176"/>
    </clipPath>
    <radialGradient id="well" cx="48%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#2c333c"/>
      <stop offset="60%" stop-color="#14181d"/>
      <stop offset="100%" stop-color="#07090c"/>
    </radialGradient>
    <filter id="pinkglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g clip-path="url(#disc)">
    <circle cx="256" cy="256" r="176" fill="url(#well)"/>
    <g fill="#ff2eb0" filter="url(#pinkglow)" transform="translate(256 256) scale(0.62) translate(-276 -256)">
      <rect x="128" y="172" width="40" height="168"/>
      <rect x="212" y="172" width="40" height="168"/>
      <polygon points="168,172 212,172 252,340 212,340"/>
      <rect x="274" y="172" width="40" height="168"/>
      <path d="M314 172h56c32 0 54 18 54 44 0 20-12 34-32 40 24 6 40 24 40 46 0 28-24 42-58 42h-60z"/>
      <path fill="#14181d" d="M314 204h42c14 0 24-8 24-18s-10-18-24-18h-42z"/>
      <path fill="#14181d" d="M314 292h48c16 0 28-8 28-22s-12-22-28-22h-48z"/>
    </g>
  </g>
</svg>
